name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install essentials
        run: |
          python -m pip install --upgrade pip
          pip install cryptography web3 fastapi "uvicorn[standard]" pydantic email-validator pyyaml pytest pytest-asyncio httpx

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}/core/src:${{ github.workspace }}
        run: |
          pytest tests/ -v --tb=short --import-mode=importlib -p no:cacheprovider

      - name: Sanity check
        run: |
          python -c "import sys; sys.path.insert(0, 'core/src'); import fastapi, pydantic, cryptography; print('Core OK')"