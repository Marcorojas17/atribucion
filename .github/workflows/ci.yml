name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install essentials
        run: |
          python -m pip install --upgrade pip
          pip install cryptography fastapi "uvicorn[standard]" pydantic email-validator pyyaml pytest pytest-asyncio httpx

      - name: Run tests
        run: |
          pytest tests/ -v --tb=short
        continue-on-error: true

      - name: Sanity check
        run: |
          python -c "import 
          fastapi; import 
          pydantic; import 
          cryptography; 
          print('Core OK')"
