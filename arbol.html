// ============================================
// UTILIDADES

function getExt(filename) {
  const parts = filename.split('.');
  if (parts.length < 2) return 'other';
  return parts[parts.length - 1].toLowerCase();
}

function isRenderable(filename) {
  const ext = getExt(filename);
  return ext === 'md' || ext === 'html' || ext === 'htm';
}

function getUrl(path) {
  if (path.endsWith('/')) {
    // Es una carpeta pendiente → link a GitHub tree
    return `https://github.com/${REPO_USER}/${REPO_NAME}/tree/${BRANCH}/${path}`;
  }
  return isRenderable(path) ? PREVIEW + path : BASE + path;
}

function getIcon(ext) {
  const map = { md: '📝', py: '🐍', html: '🌐', json: '📋', yml: '⚙️', yaml: '⚙️', toml: '⚙️', sol: '⛓️', ts: '🔷', js: '🟨' };
  return map[ext] || '📄';
}

    totalFiles++;
    if (file.status === 'ok') okFiles++;
    if (file.status === 'pending') pendingFiles++;

    const li = document.createElement('li');
    li.dataset.name = file.name.toLowerCase();
    li.dataset.section = section.name.toLowerCase();

    const ext = getExt(file.name);
    const url = getUrl(file.name);

    let badge = '';
    if (file.tag === 'new') badge = '<span class="badge new">NUEVO</span>';
    else if (file.status === 'pending') badge = '<span class="badge pending">PENDIENTE</span>';

    const shortName = file.name.includes('/') ? file.name.split('/').pop() : file.name;
    const pathPrefix = file.name.includes('/') ? file.name.substring(0, file.name.lastIndexOf('/') + 1) : '';

    li.innerHTML = `
      <a href="${url}" target="_blank" title="${file.name}">
        <span class="dot ${ext}"></span>
        <span style="overflow:hidden;text-overflow:ellipsis;">
          <span style="color:var(--text-dim);font-size:0.8em;">${pathPrefix}</span>${shortName}
        </span>
        ${badge}
        <span class="ext">${getIcon(ext)} .${ext}</span>
      </a>
    `;
    list.appendChild(li);
  });

  body.appendChild(list);
  sectionEl.appendChild(body);
  sectionsEl.appendChild(sectionEl);

  // Abrir las 3 primeras secciones por defecto
  if (idx < 2) sectionEl.classList.add('open');
});

// Actualizar stats
document.getElementById('totalCount').textContent = totalFiles;
document.getElementById('okCount').textContent = okFiles;
document.getElementById('pendingCount').textContent = pendingFiles;

// ============================================
// BÚSQUEDA
// ============================================
const searchInput = document.getElementById('search');
searchInput.addEventListener('input', (e) => {
  const q = e.target.value.trim().toLowerCase();
  let anyVisible = false;

  document.querySelectorAll('.section').forEach(section => {
    let sectionHasMatch = false;
    section.querySelectorAll('.file-list li').forEach(li => {
      const match = !q || li.dataset.name.includes(q) || li.dataset.section.includes(q);
      li.classList.toggle('hidden', !match);
      if (match) sectionHasMatch = true;
    });
    section.classList.toggle('hidden', !sectionHasMatch);
    if (sectionHasMatch) {
      anyVisible = true;
      if (q) section.classList.add('open');
    }
  });

  noResultsEl.classList.toggle('visible', !anyVisible);
});

// Atajo: presionar "/" para enfocar el buscador
document.addEventListener('keydown', (e) => {
  if (e.key === '/' && document.activeElement !== searchInput) {
    e.preventDefault();
    searchInput.focus();
  }
});
</script>
